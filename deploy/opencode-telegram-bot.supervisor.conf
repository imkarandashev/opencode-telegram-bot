[program:opencode-telegram-bot]
command=/root/opencode-telegram-bot/deploy/opencode-telegram-bot.sh
directory=/root/opencode-telegram-bot
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
